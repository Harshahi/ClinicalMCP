name: Deploy ClinicalMCP to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys race on the same instance.
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.1.0
        env:
          MCP_PAT: ${{ secrets.MCP_PAT }}
          MCP_PUBLIC_URL: ${{ secrets.MCP_PUBLIC_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          MCP_ALLOWED_ORIGINS: ${{ secrets.MCP_ALLOWED_ORIGINS }}
          SERVER_NAME: ${{ secrets.EC2_HOST }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Secrets travel as env vars, not inlined into the script text.
          envs: MCP_PAT,MCP_PUBLIC_URL,FINNHUB_API_KEY,TWELVEDATA_API_KEY,MCP_ALLOWED_ORIGINS,SERVER_NAME
          # Do NOT set script_stop here. It injects an exit-code check after every
          # line of the script, and those injected lines land inside heredoc bodies
          # and corrupt them. `set -euo pipefail` below already aborts on error.
          script: |
            set -euo pipefail

            APP_DIR=/home/ubuntu/ClinicalMCP
            REPO_URL=https://github.com/Harshahi/ClinicalMCP.git

            # Optional secrets default to empty so `set -u` does not abort on them.
            : "${FINNHUB_API_KEY:=}"
            : "${TWELVEDATA_API_KEY:=}"
            : "${MCP_ALLOWED_ORIGINS:=}"
            : "${MCP_PAT:=}"
            : "${MCP_PUBLIC_URL:=}"
            : "${SERVER_NAME:=}"

            # Fail early and legibly rather than deploying a server with no auth.
            if [ -z "$MCP_PAT" ]; then
              echo "ERROR: the MCP_PAT repository secret is empty or unset."
              echo "Without it the server accepts unauthenticated requests. Set it and re-run."
              exit 1
            fi
            if [ -z "$MCP_PUBLIC_URL" ]; then
              echo "ERROR: the MCP_PUBLIC_URL repository secret is empty or unset."
              exit 1
            fi

            # ---------- 1. host prerequisites ----------
            if ! command -v docker >/dev/null 2>&1 || ! sudo docker compose version >/dev/null 2>&1; then
              echo "Installing Docker and Compose..."
              sudo apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                docker.io docker-compose-v2 git nginx
              sudo systemctl enable --now docker
            fi

            command -v nginx >/dev/null 2>&1 || {
              sudo apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
            }

            # ---------- 2. sync source ----------
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            # Force HTTPS: the instance has no GitHub deploy key, so an SSH remote cannot fetch.
            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git checkout -B main origin/main
            # Idempotent: discards any drift on the box so the deploy always matches main.
            git reset --hard origin/main

            # ---------- 3. runtime config ----------
            # .env is gitignored, so it survives the reset above and is not committed.
            # Written by python straight from the env vars: secret values stay literal,
            # with no shell expansion of $, backticks or backslashes.
            umask 077
            python3 - <<'PYEOF'
            import os

            public_url = os.environ.get("MCP_PUBLIC_URL", "").rstrip("/")
            settings = [
                ("MCP_PAT", os.environ.get("MCP_PAT", "")),
                ("MCP_ACCESS_URL", f"{public_url}/mcp"),
                ("MCP_PUBLIC_URL", public_url),
                ("MCP_HOST", "0.0.0.0"),
                ("MCP_PORT", "8000"),
                ("FINNHUB_API_KEY", os.environ.get("FINNHUB_API_KEY", "")),
                ("TWELVEDATA_API_KEY", os.environ.get("TWELVEDATA_API_KEY", "") or "demo"),
                # Empty means no browser origin is trusted, which is the safe default.
                ("MCP_ALLOWED_ORIGINS", os.environ.get("MCP_ALLOWED_ORIGINS", "")),
            ]
            with open(".env", "w") as handle:
                for key, value in settings:
                    handle.write(f"{key}={value}\n")
            PYEOF
            chmod 600 .env

            # Fail loudly if the PAT did not survive into the file the container reads.
            if ! grep -q "^MCP_PAT=." .env; then
              echo "ERROR: .env was written without an MCP_PAT value."
              exit 1
            fi

            # ---------- 4. build and start ----------
            sudo docker compose up -d --build --remove-orphans
            sudo docker image prune -f

            # ---------- 5. reverse proxy ----------
            # default_server so requests by raw IP also reach the app, not the nginx welcome page.
            sudo tee /etc/nginx/conf.d/clinicalmcp.conf >/dev/null <<'NGINXEOF'
            # conf.d is included in the http context, which is where a zone must live.
            # 10 req/s per client IP, so guessing the PAT is not a matter of brute force.
            limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=10r/s;
            limit_req_status 429;

            server {
                listen 80 default_server;
                server_name __SERVER_NAME__ _;

                location / {
                    # burst absorbs a normal client opening several streams at once;
                    # nodelay serves the burst immediately rather than queueing it.
                    limit_req zone=mcp_limit burst=20 nodelay;

                    proxy_pass http://127.0.0.1:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;

                    # MCP streamable HTTP keeps SSE streams open: buffering or a short
                    # read timeout here truncates tool responses mid-stream.
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_buffering off;
                    proxy_cache off;
                    chunked_transfer_encoding off;
                    proxy_read_timeout 3600s;
                    proxy_send_timeout 3600s;
                }
            }
            NGINXEOF
            sudo sed -i "s|__SERVER_NAME__|${SERVER_NAME}|" /etc/nginx/conf.d/clinicalmcp.conf

            # Ubuntu ships a default_server on :80; two of them is a config error.
            sudo rm -f /etc/nginx/sites-enabled/default

            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx

            # ---------- 6. smoke test ----------
            echo "Waiting for the app to accept connections..."
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null "http://127.0.0.1:8000/mcp" \
                   -X POST -H "Authorization: Bearer ${MCP_PAT}" \
                   -H 'Content-Type: application/json' \
                   -H 'Accept: application/json, text/event-stream' \
                   -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"deploy-smoke","version":"1"}}}'; then
                echo "Direct app check passed."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "App did not come up. Recent container logs:"
                sudo docker compose logs --tail=80 clinicalmcp || true
                exit 1
              fi
              sleep 2
            done

            # Same request through nginx, to prove the proxy path works too.
            # `systemctl reload` only sends SIGHUP and returns immediately, so the new
            # config is not necessarily live yet. Retry rather than racing the reload:
            # checking once here returned 404 from the outgoing default site.
            echo "Waiting for nginx to serve the new config..."
            PROXY_CODE=000
            for i in $(seq 1 20); do
              PROXY_CODE=$(curl -s -m 15 -o /dev/null -w '%{http_code}' "http://127.0.0.1/mcp" \
                -X POST -H "Authorization: Bearer ${MCP_PAT}" \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json, text/event-stream' \
                -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"deploy-smoke","version":"1"}}}')
              if [ "$PROXY_CODE" = "200" ]; then
                echo "Through nginx: HTTP 200"
                break
              fi
              echo "  attempt ${i}: HTTP ${PROXY_CODE}, retrying..."
              sleep 2
            done
            if [ "$PROXY_CODE" != "200" ]; then
              echo "Proxy check failed after 20 attempts (last: HTTP ${PROXY_CODE})."
              echo "Active server blocks on :80:"
              sudo nginx -T 2>/dev/null | grep -nE 'server_name|listen' || true
              sudo tail -n 40 /var/log/nginx/error.log || true
              exit 1
            fi

            # Confirm the PAT gate actually rejects unauthenticated callers.
            UNAUTH_CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1/mcp" -X POST \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' -d '{}')
            echo "Unauthenticated request: HTTP ${UNAUTH_CODE} (expect 401)"
            if [ "$UNAUTH_CODE" != "401" ]; then
              echo "WARNING: endpoint is not enforcing the PAT."
              exit 1
            fi

            echo "Deploy complete."
