name: Deploy ClinicalMCP to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install package locally
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if [ ! -d /home/ubuntu/ClinicalMCP/.git ]; then
              git clone git@github.com:Harshahi/ClinicalMCP.git /home/ubuntu/ClinicalMCP
            fi
            cd /home/ubuntu/ClinicalMCP
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            python3 -m venv .venv || true
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e .

            cat > .env <<EOF
            MCP_PAT=${{ secrets.MCP_PAT }}
            MCP_ACCESS_URL=${{ secrets.MCP_PUBLIC_URL }}/mcp
            MCP_PUBLIC_URL=${{ secrets.MCP_PUBLIC_URL }}
            MCP_HOST=0.0.0.0
            MCP_PORT=8000
            EOF

            sudo tee /etc/systemd/system/clinicalmcp.service >/dev/null <<'EOF'
            [Unit]
            Description=ClinicalMCP Server
            After=network.target

            [Service]
            WorkingDirectory=/home/ubuntu/ClinicalMCP
            EnvironmentFile=/home/ubuntu/ClinicalMCP/.env
            ExecStart=/home/ubuntu/ClinicalMCP/.venv/bin/python -m mcp_clinical.server
            Restart=always
            RestartSec=5
            User=ubuntu
            Group=ubuntu

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable --now clinicalmcp.service
            sudo systemctl restart clinicalmcp.service

            sudo tee /etc/nginx/conf.d/clinicalmcp.conf >/dev/null <<'EOF'
            server {
                listen 80;
                server_name ${{ secrets.EC2_HOST }};

                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx
