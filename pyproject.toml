[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-clinical"
version = "0.1.0"
description = "MCP server for ClinicalTrials.gov and company market pricing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.10.0,<2",
  "httpx>=0.28.1",
  "python-dotenv>=1.0.1",
]

[project.scripts]
mcp-clinical = "mcp_clinical.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
